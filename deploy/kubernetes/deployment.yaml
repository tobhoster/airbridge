# airbridge on Kubernetes: one replica on the host network (mDNS and the
# scanners' own protocols need the LAN, not the pod network).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airbridge
  labels:
    app.kubernetes.io/name: airbridge
spec:
  replicas: 1
  # Two copies would announce the same scanners twice; never overlap.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: airbridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airbridge
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      terminationGracePeriodSeconds: 10
      containers:
        - name: airbridge
          image: airbridge
          imagePullPolicy: IfNotPresent
          ports:
            - name: escl
              containerPort: 8090
            - name: ipp
              containerPort: 631
          env:
            - name: RUST_LOG
              value: info,mdns_sd=warn
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 48Mi
            limits:
              # A page whose length the scanner does not announce (some
              # feeders) is buffered before encoding.
              memory: 1Gi
          securityContext:
            # cupsd and brsaneconfig4 need root inside the container; nothing
            # else is granted.
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID, NET_BIND_SERVICE, KILL]
