# kubectl apply -k deploy/kubernetes
#
# Point `images` at the registry you pushed your build to, e.g.
#   kustomize edit set image airbridge=registry.example.com/airbridge:0.1.0
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
images:
  - name: airbridge
    newName: registry.example.com/airbridge
    newTag: "0.1.0"
