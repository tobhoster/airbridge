# kubectl apply -k deploy/kubernetes
#
# Runs the published image. To run your own build instead:
#   kustomize edit set image airbridge=registry.example.com/airbridge:tag
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
images:
  - name: airbridge
    newName: ghcr.io/tobhoster/airbridge
    newTag: latest
