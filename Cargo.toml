[package]
name = "airbridge"
version = "0.1.0"
edition = "2024"
description = "AirScan (eSCL) and AirPrint for printers and scanners that lack them"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tobhoster/airbridge"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query"] }
bytes = "1.12.1"
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio", "server", "http1"] }
if-addrs = "0.15.0"
ipnet = "2.12.2"
libloading = "0.9.0"
mdns-sd = "0.21.5"
mozjpeg = "0.10.13"
parking_lot = "0.12.5"
png = "0.18.1"
quick-xml = "0.31"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "process", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter", "fmt"] }
uuid = { version = "1.28.0", features = ["v4", "v5"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
jpeg-decoder = "0.3.2"
mdns-sd = "0.21.5"
parking_lot = "0.12.5"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
ureq = "2"
uuid = "1.28.0"

[[bench]]
name = "perf"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
