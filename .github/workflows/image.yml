name: image

# The published image: built with BRSCAN4=runtime, so it holds no Brother
# code (the entrypoint downloads brscan4 from Brother on first start and
# checks its SHA-256). amd64 and arm64 build natively, are tested, then
# pushed by digest and merged into one multi-arch tag.
#
#   main      -> ghcr.io/<repo>:latest, :sha-<short>
#   tag v1.2.3 -> :1.2.3, :1.2
#   PRs       -> build and test only

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build (BRSCAN4=runtime)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: BRSCAN4=runtime
          load: true
          tags: airbridge:test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
      - name: Image size budget (bytes of the root filesystem)
        run: scripts/size-budget.sh airbridge:test
      - name: Entrypoint and runtime brscan4 edge cases
        run: scripts/test-image.sh airbridge:test
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: github.event_name != 'pull_request'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: BRSCAN4=runtime
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0
            org.opencontainers.image.description=AirScan and AirPrint bridge for older network scanners and printers
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
      - name: Record the digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest='${{ steps.push.outputs.digest }}'
          test -n "$digest"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the platform images into one tag
        working-directory: ${{ runner.temp }}/digests
        run: |
          test "$(ls | wc -l)" = 2
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
      - name: Check the published tag
        run: |
          ref="${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
          docker buildx imagetools inspect "$ref"
          platforms=$(docker buildx imagetools inspect "$ref" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform | select(.os == "linux") | .architecture] | sort | join(",")')
          echo "platforms: $platforms"
          test "$platforms" = "amd64,arm64"
          docker run --rm --pull always --entrypoint sh "$ref" -c \
            'test "$BRSCAN4_MODE" = runtime && test ! -e /opt/brother'
