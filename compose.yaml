# docker compose up -d
#
# Runs the published image on the host network, which mDNS needs. Linux
# hosts only: Docker Desktop on macOS/Windows has no real host networking.
#
# The image holds no Brother code. On amd64, the first start downloads
# Brother's brscan4 driver from Brother, checks its SHA-256 and keeps it in
# the `airbridge-data` volume. To build the image yourself instead, see the
# README ("Build it yourself").
services:
  airbridge:
    image: ghcr.io/tobhoster/airbridge:latest
    network_mode: host
    restart: unless-stopped
    volumes:
      - airbridge-data:/var/lib/airbridge
    # Optional settings, see README "Configuration":
    # environment:
    #   AIRBRIDGE_NO_PRINT: "MYPRINTER"
    #   AIRBRIDGE_LOCATION: "Office"
    #   AIRBRIDGE_BRSCAN4: "off"

volumes:
  airbridge-data:
